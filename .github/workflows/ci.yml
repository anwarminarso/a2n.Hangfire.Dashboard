name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A new push supersedes an in-flight run for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (net8.0 / net9.0 / net10.0)
    runs-on: ubuntu-latest

    services:
      # The PostgreSQL suite skips itself when no server is reachable, so this container is what makes
      # the adapter actually covered here instead of reported as skipped.
      # Credentials match tests/a2n.Hangfire.Dashboard.PostgreSql.Tests/appsettings.json, which is
      # committed — a throwaway local test password, not a secret.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: "12345"
          POSTGRES_DB: hangfire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The SQL Server suite skips itself when no server is reachable; this container makes the
      # SQL Server adapter covered too. The sa password is a throwaway for this container only, not
      # a secret. The image ships sqlcmd under /opt/mssql-tools18 (the runner may not have one).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "HangfireTest_12345"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P HangfireTest_12345 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "src/Hangfire Dashboard.slnx"

      - name: Build
        run: dotnet build "src/Hangfire Dashboard.slnx" -c Release --no-restore

      # Hangfire.SqlServer doesn't create the database; the suite creates its own schema inside it.
      - name: Create the SQL Server test database
        run: >
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P HangfireTest_12345 -b
          -Q "IF DB_ID('HangfireTest') IS NULL CREATE DATABASE HangfireTest"

      # Covers the six test projects in the solution, each across all three target frameworks.
      # PostgreSQL and SQL Server run against the service containers above; both adapter suites use
      # SkippableFact, so they would only skip if a container were missing.
      - name: Test
        env:
          ConnectionStrings__SqlServer: "Server=localhost,1433;Database=HangfireTest;User Id=sa;Password=HangfireTest_12345;TrustServerCertificate=true;"
        run: >
          dotnet test "src/Hangfire Dashboard.slnx" -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/test-results
          if-no-files-found: warn
          retention-days: 14
