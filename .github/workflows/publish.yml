name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  # The full build-and-test workflow (PostgreSQL and SQL Server containers, net8/9/10) runs on the
  # release commit first; the packages are only published when it passes.
  test:
    name: Build & test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The tag must match <Version> in Directory.Build.props (an optional leading "v" is allowed),
      # otherwise the release would publish packages with a different version than its name.
      - name: Check release tag against version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi
          echo "Publishing version $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "src/Hangfire Dashboard.slnx"

      - name: Build
        run: dotnet build "src/Hangfire Dashboard.slnx" -c Release --no-restore

      # Packs every project under src/ (each one is a shipped package), so a new package can't be
      # forgotten here.
      - name: Pack
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" -c Release --no-build -o ./nupkgs
          done
          ls -1 ./nupkgs

      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
