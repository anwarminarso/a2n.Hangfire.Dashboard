# Mimics a typical Nginx Proxy Manager proxy host: HTTP -> HTTPS redirect, TLS termination,
# Host = $host (no port), X-Forwarded-* sent (the app ignores them unless App__UseForwardedHeaders=true).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Same fields as the issue #61 log excerpt, plus timings.
log_format proxy '[$time_local] $status $request_method $scheme "$request_uri" '
                 '[Client $remote_addr] "$http_user_agent" rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/proxy/access.log proxy;
    access_log /dev/stdout proxy;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    access_log /var/log/nginx/proxy/access.log proxy;
    access_log /dev/stdout proxy;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
